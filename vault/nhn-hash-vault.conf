# NHN Vault HA Load Balancer
# Domain : nhn-hash-vault.koneksi.co.kr
# Backends: 3-node Vault Raft cluster (plain HTTP on :8200)
# TLS    : terminated here using wildcard cert
#
# Vault health codes:
#   200 = active (leader)   — serves traffic
#   429 = standby           — skip, try next upstream
#   503 = sealed            — skip
#   501 = not initialized   — skip
#   error / timeout         — skip

upstream vault_cluster {
    least_conn;

    # vault-1  public: 133.186.244.78  private: 192.168.0.51
    server 133.186.244.78:8200 max_fails=2 fail_timeout=30s;

    # vault-2  public: 133.186.144.39  private: 192.168.0.92
    server 133.186.144.39:8200 max_fails=2 fail_timeout=30s;

    # vault-3  public: 125.6.40.253    private: 192.168.0.97
    server 125.6.40.253:8200   max_fails=2 fail_timeout=30s;

    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name nhn-hash-vault.koneksi.co.kr;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — TLS termination + reverse proxy to vault cluster
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nhn-hash-vault.koneksi.co.kr;

    ssl_certificate     /etc/ssl/koneksi/fullchain.pem;
    ssl_certificate_key /etc/ssl/koneksi/private.key;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     10m;

    # Required for Vault snapshots / large restore payloads
    client_max_body_size 0;

    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        proxy_pass http://vault_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Vault-Request   true;

        proxy_buffering         off;
        proxy_request_buffering off;

        # Skip to next upstream on: network error, timeout,
        # standby (429), not-init (501), bad-gateway (502), sealed (503)
        proxy_next_upstream         error timeout http_429 http_502 http_503;
        proxy_next_upstream_tries   3;
        proxy_next_upstream_timeout 10s;
    }

    # Health endpoint — used by Prometheus blackbox probe
    location = /v1/sys/health {
        proxy_pass http://vault_cluster/v1/sys/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream         error timeout http_429 http_502 http_503;
        proxy_next_upstream_tries   3;
        proxy_next_upstream_timeout 10s;
    }
}
