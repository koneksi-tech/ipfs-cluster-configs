user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
#include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

        lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        lua_ssl_verify_depth 3;

	access_log /var/log/nginx/access.log;

        lua_package_path "/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;/usr/local/share/lua/5.1/?.lua;/usr/local/share/lua/5.1/?/init.lua;;";

        # Dedup store for IPFS failed-request Discord alerts
        # 5xx: keyed by upstream+status (60s TTL) — one alert/min per down node
        # 4xx: keyed by client_ip+status (120s TTL) — one alert/2min per bad client
        lua_shared_dict ipfs_alert_dedup 1m;

        resolver 127.0.0.53 valid=30s ipv6=off;
        resolver_timeout 5s;



	##
	# Gzip Settings
	##

        proxy_cache_path /var/cache/nginx/ipfs
          levels=1:2
          keys_zone=ipfs_cache:200m
          max_size=200g
          inactive=7d
          use_temp_path=off;

        log_format bw_per_client escape=json
          '{'
            '"time":"$time_iso8601",'
            '"client_id":"$http_client_id",'
            '"env":"$http_environment",'
            '"bytes":$body_bytes_sent,'
            '"status":$status,'
            '"uri":"$uri",'
            '"range":"$http_range",'
            '"cache":"$upstream_cache_status",'
            '"upstream":"$upstream_addr"'
          '}';

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	#include /etc/nginx/sites-enabled/*;
}
