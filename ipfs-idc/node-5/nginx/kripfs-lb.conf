server {
    listen 80;
    listen [::]:80;
    server_name kripfs-cluster.koneksi.co.kr;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kripfs-cluster.koneksi.co.kr;

    ssl_certificate     /etc/ssl/certs/koneksi.co.kr/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/koneksi.co.kr/koneksi.co.kr.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10G;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    proxy_send_timeout 300s;
    send_timeout 300s;

    # Static Bearer for kripfs IDC: excluded from bandwidth tracking
    set $static_bearer_key "Bearer a3c5e5e0625295fe65e0fbf489f6dcc99503ead8c696102376113db2331f2830";

    # ----------------------------------------
    # kripfs gateway: per-request alerts + bandwidth tracking
    # ----------------------------------------
    location ~ ^/(ipfs|ipns)/ {
        access_by_lua_block {
            local auth = ngx.var.http_authorization or ""
            local static_key = ngx.var.static_bearer_key or ""
            if static_key ~= "" and auth == static_key then
                ngx.ctx.is_static_bearer = true
            end
        }
        access_log /var/log/nginx/kripfs_bw_per_client.json bw_per_client;

        proxy_pass https://kripfs_pool;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Client-ID $http_client_id;
        proxy_set_header Client-Secret $http_client_secret;
        proxy_set_header Environment $http_environment;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Buffering ON so log_by_lua has bytes_sent for bw tracking
        proxy_request_buffering off;
        proxy_buffering on;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header Accept-Ranges bytes always;

        # ----------------------------------------------------
        # Bandwidth Tracking + Discord Failed-Request Alerts (Lua) — kripfs IDC
        # ----------------------------------------------------
        log_by_lua_block {
            ngx.log(ngx.WARN, "[bw-kripfs] log_by_lua ran uri=", ngx.var.uri or "-", " status=", ngx.var.status or "-")

            local status = tonumber(ngx.var.upstream_status) or tonumber(ngx.var.status) or 0

            -- ── Discord alert for failed kripfs requests ──────────────────
            -- Fires for GET/POST only — OPTIONS (CORS preflight, 204) is excluded.
            -- Skip 499 (client closed connection) — was noisy from cross-cluster mistakes.
            -- Dedup keys prefixed with "kripfs|" to avoid colliding with kubo in shared dict.
            local method = ngx.var.request_method or "?"
            if status > 0 and status ~= 200 and status ~= 206 and status ~= 499
               and method ~= "OPTIONS" then
                local dedup     = ngx.shared.ipfs_alert_dedup
                local client_ip = ngx.var.remote_addr or "?"
                local upstream  = ngx.var.upstream_addr or "?"
                local uri       = ngx.var.uri or "?"
                local env       = ngx.var.http_environment or ""

                local dedup_key, dedup_ttl
                if status >= 500 then
                    dedup_key = "kripfs|" .. upstream .. "|" .. status
                    dedup_ttl = 60
                else
                    dedup_key = "kripfs|" .. client_ip .. "|" .. status
                    dedup_ttl = 120
                end

                if not dedup:get(dedup_key) then
                    dedup:set(dedup_key, true, dedup_ttl)

                    local emoji = "❌"
                    if status >= 500 then emoji = "🔴" end
                    if status == 401 or status == 403 then emoji = "🔒" end
                    if status == 404 then emoji = "🔍" end

                    local env_line = ""
                    if env ~= "" then env_line = "\n**Env:** " .. env end

                    -- Resolve the auth-validation backend from the Environment header
                    local backend_line = ""
                    if env == "production" or env == "prod" then
                        backend_line = "\n**Backend:** https://api.koneksi.co.kr"
                    elseif env == "staging" then
                        backend_line = "\n**Backend:** https://staging.koneksi.co.kr"
                    elseif env == "uat" then
                        backend_line = "\n**Backend:** https://uat.koneksi.co.kr"
                    end

                    local cjson = require "cjson"
                    local msg = emoji .. " **kripfs Failed Request**"
                        .. "\n**Cluster:** kripfs-IDC"
                        .. "\n**Cluster endpoint:** https://kripfs-cluster.koneksi.co.kr"
                        .. "\n**Method:** " .. method
                        .. "\n**Status:** " .. status
                        .. "\n**URI:** `" .. uri .. "`"
                        .. env_line
                        .. backend_line
                        .. "\n**Time:** " .. (ngx.var.time_iso8601 or "?")

                    local webhook_url = "https://discord.com/api/webhooks/1500690813439709304/OZaTtp1X2e88iZSnG8gvnkKHHs7Yya_FCxqG6zH-pWgNsQ46bOABTI56dsZmtKK-ezlu"
                    local payload = cjson.encode({ content = msg })

                    ngx.timer.at(0, function(premature, wurl, wpayload)
                        if premature then return end
                        local http = require "resty.http"
                        local httpc = http.new()
                        httpc:set_timeout(3000)
                        local res, err = httpc:request_uri(wurl, {
                            method     = "POST",
                            headers    = { ["Content-Type"] = "application/json" },
                            body       = wpayload,
                            ssl_verify = true,
                        })
                        if not res then
                            ngx.log(ngx.ERR, "[discord] kripfs alert failed: ", err)
                        end
                    end, webhook_url, payload)
                end
            end
            -- ── end Discord alert ──

            local auth = ngx.var.http_authorization or ""
            local env = ngx.var.http_environment or ""
            local client_id = ngx.var.http_client_id or ""
            local client_secret = ngx.var.http_client_secret or ""

            if env == "" then return end
            if ngx.ctx.is_static_bearer then return end
            if auth == "" and (client_id == "" or client_secret == "") then return end
            if status ~= 200 and status ~= 206 then return end

            local bytes = tonumber(ngx.var.bytes_sent) or 0
            if bytes <= 0 then
                bytes = tonumber(ngx.var.upstream_response_length) or 0
            end
            if bytes <= 0 then
                ngx.log(ngx.WARN, "[bw-kripfs] skip: bytes=0 uri=", ngx.var.uri or "")
                return
            end

            local target_host
            if env == "production" or env == "prod" then
                target_host = "api.koneksi.co.kr"
            elseif env == "staging" then
                target_host = "staging.koneksi.co.kr"
            elseif env == "uat" then
                target_host = "uat.koneksi.co.kr"
            else
                ngx.log(ngx.WARN, "Unknown Environment value (kripfs): '", env, "' - skipping bandwidth update")
                return
            end

            local url = "https://" .. target_host .. "/gateway/bandwidth/update"

            local headers = {
                ["Content-Type"] = "application/json",
                ["Environment"] = env,
            }
            if auth ~= "" then
                headers["Authorization"] = auth
            else
                headers["Client-ID"] = client_id
                headers["Client-Secret"] = client_secret
            end

            local body = '{"bytes_transferred":' .. bytes .. '}'

            ngx.log(ngx.WARN, "[bw-kripfs] sending update env=", env, " bytes=", bytes, " host=", target_host)

            local ok, err = ngx.timer.at(0, function(premature, url, headers, body)
                if premature then return end
                local http = require "resty.http"
                local httpc = http.new()
                httpc:set_timeout(2000)
                local res, req_err = httpc:request_uri(url, {
                    method = "POST",
                    headers = headers,
                    body = body,
                    ssl_verify = true
                })
                if not res then
                    ngx.log(ngx.ERR, "kripfs bandwidth update failed: ", req_err)
                    return
                end
                if res.status < 200 or res.status >= 300 then
                    ngx.log(ngx.ERR, "kripfs bandwidth update non-2xx: ", res.status, " body=", res.body or "")
                end
            end, url, headers, body)

            if not ok then
                ngx.log(ngx.ERR, "failed to create timer: ", err)
            end
        }
    }

    # ----------------------------------------
    # Catch-all: API, uploads, health (no bw tracking, streaming buffering off)
    # ----------------------------------------
    location / {
        proxy_pass https://kripfs_pool;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Client-ID $http_client_id;
        proxy_set_header Client-Secret $http_client_secret;
        proxy_set_header Environment $http_environment;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
