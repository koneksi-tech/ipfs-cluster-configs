# Performance optimizations for IPFS


gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 4;

# Cache settings
proxy_cache_path /var/cache/nginx/ipfs_cache levels=1:2 keys_zone=ipfs_cache:50m max_size=5g inactive=7d use_temp_path=off;
proxy_cache_path /var/cache/nginx/ipfs_temp levels=1:2 keys_zone=ipfs_temp:10m max_size=1g inactive=60m use_temp_path=off;

# Upstreams
upstream ipfs_gateway {
    server 127.0.0.1:8080;
    keepalive 128;
    keepalive_requests 1000;            # ADD
    keepalive_timeout 60s;   

}

upstream ipfs_api {
    server 127.0.0.1:5001;
    keepalive 96;
    keepalive_requests 1000;            # ADD
    keepalive_timeout 60s;   
}

upstream ipfs_cluster {
    server 127.0.0.1:9094;
#    server 211.239.117.217:9094;
#    server 218.38.136.33:9094;
#    server 218.38.136.34:9094;
    keepalive 96;
    keepalive_requests 1000;            # ADD
    keepalive_timeout 60s;   
}

proxy_http_version 1.1;
proxy_set_header Connection "";




# Upload settings
client_max_body_size 5G;
client_body_buffer_size 256M;
client_body_temp_path /var/cache/nginx/client_temp 1 2;

proxy_request_buffering off;
proxy_buffering off;



# Timeouts
proxy_connect_timeout 300s;
proxy_send_timeout 3600s;
proxy_read_timeout 3600s;
send_timeout 3600s;

# Buffer settings
proxy_buffer_size 256k;
proxy_buffers 8 256k;
proxy_busy_buffers_size 512k;
proxy_temp_file_write_size 512k;

# Header settings
client_header_buffer_size 64k;
large_client_header_buffers 4 64k;

# Keepalive
keepalive_timeout 65s;
keepalive_requests 1000;

# Rate limiting
#limit_req_zone $binary_remote_addr zone=ipfs_limit:10m rate=100r/s;
limit_req_status 429;
