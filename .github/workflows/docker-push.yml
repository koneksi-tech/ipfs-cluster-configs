# Builds and pushes the progress-report Docker image to Docker Hub.
# Triggers on every push to main.
#
# Required GitHub secrets:
#   DOCKERHUB_USERNAME  — your Docker Hub username
#   DOCKERHUB_TOKEN     — Docker Hub access token (Account Settings → Security)
#
# Image is pushed as:
#   <username>/koneksi-infra-progress:latest
#   <username>/koneksi-infra-progress:<short-sha>

name: Build & Push Progress Report

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/koneksi-infra-progress:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/koneksi-infra-progress:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
